<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة الجلوس</title>
<style>
/* خطوط ثمانية — استخدام شخصي بإذن من ثمانية (ثلاثة أوزان فقط) */
@font-face{font-family:ThmanyahApp;font-weight:400;font-display:swap;src:url(thmanyahsans-Regular.woff2) format('woff2')}
@font-face{font-family:ThmanyahApp;font-weight:700;font-display:swap;src:url(thmanyahsans-Bold.woff2) format('woff2')}
@font-face{font-family:ThmanyahApp;font-weight:900;font-display:swap;src:url(thmanyahsans-Black.woff2) format('woff2')}
@font-face{font-family:ThmanyahDisp;font-weight:700;font-display:swap;src:url(thmanyahserifdisplay-Bold.woff2) format('woff2')}
@font-face{font-family:ThmanyahDisp;font-weight:900;font-display:swap;src:url(thmanyahserifdisplay-Black.woff2) format('woff2')}
:root{--fs:1;--gold:#f1dc9a;--mint:#8ff0b9;--fg:#eef2f6;--mut:#aab8c6;--line:#ffffff26;--card:#ffffff10;--blur:0px;--bf:none;--b0:#233a5c;--b1:#121e33;--b2:#080d18;--acc:#8ff0b9}
body[data-theme=teal]{--b0:#1d4a47;--b1:#0f2a2c;--b2:#071517}
body[data-theme=warm]{--b0:#4a423a;--b1:#2a2622;--b2:#15120f}
body.friday.nophoto{--b0:#1f4a3a;--b1:#12281f;--b2:#0a1612}
body.rainy{--gold:#bfe0ff;--acc:#bfe0ff}body.rainy.nophoto{--b0:#27487a;--b1:#16294a;--b2:#0b1527}
body[data-mode=glass]{--card:#ffffff1c;--blur:14px;--bf:blur(14px);--line:#ffffff30}
html{font-size:calc(min(100vw/120,100vh/67.5)*var(--fs))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--fg);font-family:ThmanyahApp,Tajawal,"Segoe UI",Tahoma,sans-serif;font-weight:400;background:var(--b2);cursor:none}
body.mouse{cursor:auto}
body[data-font=display]{font-family:ThmanyahDisp,ThmanyahApp,Tajawal,sans-serif}
button,a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
#bg{position:fixed;inset:0;background:linear-gradient(160deg,var(--b0) 0%,var(--b1) 55%,var(--b2) 100%)}
body[data-mode=glass] #bg{background:radial-gradient(120% 90% at 20% 0%,var(--b0),var(--b1) 55%,var(--b2))}
#ph{position:fixed;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease}
body.hasphoto #ph{opacity:1}
body.nophoto #ph{opacity:0!important}
body[data-motion=soft].hasphoto #ph{animation:kb 50s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,-.8%)}}
#scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.72));opacity:0;transition:opacity .6s}
body.hasphoto #scrim{opacity:1}
body[data-dim=low] #scrim{background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.5))}
body[data-dim=high] #scrim{background:linear-gradient(180deg,rgba(0,0,0,.66),rgba(0,0,0,.86))}
body.nophoto #scrim{opacity:0!important}
#app{position:fixed;inset:0;transition:transform 4s ease}
.tx{text-shadow:0 1px 14px #0009}
/* ===== الشريط العلوي ===== */
#top{position:absolute;top:2.2rem;left:3rem;right:3rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;z-index:3;height:3.6rem}
#hclock{justify-self:start;min-width:12rem}
body[data-page=home] #hclock{visibility:hidden}
.ck{direction:ltr;display:flex;align-items:flex-end;justify-content:flex-end;gap:.45rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.ck small{font-size:.26em;font-weight:700;margin-bottom:.14em;opacity:.9}
#hclock .ck{font-size:3.4rem}
#hclock .dl{font-size:.95rem;color:var(--mut);margin-top:.35rem;text-align:right}
.dl b{color:var(--gold);font-weight:700}
#tabs{display:flex;gap:2.4rem;padding-top:.4rem;position:relative;min-width:30rem;justify-content:center}
.tab{background:none;border:0;padding:.35rem .2rem;font-size:1.55rem;font-weight:400;color:var(--mut);border-bottom:.2rem solid transparent;text-shadow:0 1px 10px #0007;transition:color .2s;position:relative}
.tab.on{color:#fff;font-weight:700;border-bottom-color:var(--gold)}
.tab.live::after{content:"";position:absolute;top:.2rem;left:-.5rem;width:.6rem;height:.6rem;border-radius:50%;background:#ff6b6b;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
body[data-mode=glass] .tab.on{border-bottom-color:transparent;background:#ffffff2b;border-radius:99px;padding:.35rem 1.2rem;margin:0 -1rem}
#tools{justify-self:end;display:flex;gap:1.1rem;align-items:center;padding-top:.5rem}
.tl{width:3.1rem;height:3.1rem;border-radius:50%;border:.14rem solid transparent;background:none;display:grid;place-items:center;padding:0;font-size:1.7rem;opacity:.9;position:relative}
.tl svg{width:55%;height:55%}
#rf{border-color:var(--fc,#ffffff40)}
#rf.spin span{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.st-g{--fc:#4ade80}body.st-y{--fc:#facc15}body.st-r{--fc:#f87171}
#rf::after{content:"";position:absolute;top:.1rem;right:.1rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--fc,transparent);box-shadow:0 0 .6rem var(--fc,transparent)}
:is(button,a):focus-visible{outline:.22rem solid var(--gold);outline-offset:.25rem;border-radius:.6rem}
.tl:focus-visible{border-radius:50%}
/* إشعار الصلاة: يحل محل صف التبويبات */
#alert{display:none;justify-self:center;align-self:center;text-align:center;padding-top:.35rem}
body.alerting #tabs{visibility:hidden}
body.alerting #alert{display:block;position:absolute;left:0;right:0;top:0;text-align:center}
#alert .a1{display:inline-flex;align-items:center;gap:1rem;font-size:1.9rem;font-weight:900;color:var(--gold);padding:.3rem 1.6rem;border-radius:99px;background:#f1dc9a24;border:.1rem solid #f1dc9a66;animation:pulse 2.4s ease-in-out infinite}
#alert .a1 i{font-style:normal;font-size:1.6rem}
@keyframes pulse{50%{background:#f1dc9a38}}
/* ===== الصفحات ===== */
#pages{position:absolute;top:7.6rem;left:3rem;right:3rem;bottom:2rem}
.pg{position:absolute;inset:0;display:none}
body[data-page=home] #p-home,body[data-page=sports] #p-sports,body[data-page=news] #p-news,body[data-page=settings] #p-settings{display:block}
.gold{color:var(--gold)}
.mut{color:var(--mut)}
/* ===== الرئيسية ===== */
#hm{position:absolute;top:-4.2rem;right:0;text-align:right;width:31rem}
#gr{color:var(--gold);font-size:1.5rem;font-weight:700}
#hm .ck{font-size:10.5rem;margin-top:.1rem}
#hm .dl{font-size:1.25rem;margin-top:.6rem;color:var(--fg)}
#hm .dl2{font-size:.95rem;color:var(--mut);margin-top:.2rem}
#wxb{margin-top:1.6rem;width:31rem}
.wxr{display:flex;direction:rtl;gap:1.1rem;align-items:flex-start}
.wh{text-align:center;min-width:3.6rem}
.wh span{display:block;color:var(--mut);font-size:.85rem}
.wh svg{width:1.8rem;height:1.8rem;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:.15rem auto}
.wh b{display:block;direction:ltr;font-size:1.25rem;font-weight:700}
.wh em{display:block;font-style:normal;font-size:.8rem;color:#bfe0ff;min-height:1.1rem}
.wh.now{padding-inline-start:0;padding-inline-end:1rem;border-inline-end:.07rem solid var(--line)}
.wh.now b{font-size:2.1rem;font-weight:900}
.wh.now span{color:var(--gold)}
.wdt{margin-top:.5rem;color:var(--mut);font-size:.9rem}
#lines{margin-top:1.4rem;width:31rem;font-size:1.05rem;line-height:2}
#lines b{color:var(--gold);font-weight:700}
#lines .rib{display:flex;gap:1.2rem}
#lines .rb{flex:1;padding:.7rem 1rem;border-radius:1rem;background:var(--card);backdrop-filter:var(--bf);border:.07rem solid var(--line)}
#lines .rb .t{display:flex;justify-content:space-between;font-size:.95rem}
#lines .rb .bar{height:.35rem;border-radius:99px;background:#ffffff26;margin:.45rem 0 .25rem;overflow:hidden}
#lines .rb .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
#lines .rb small{color:var(--mut);font-size:.8rem}
/* الصلاة */
#pr{position:absolute;left:0;top:-1.6rem;width:33rem}
#pr .ttl{color:var(--gold);font-size:1.1rem;padding-bottom:.5rem;border-bottom:.07rem solid var(--line)}
.pr{display:flex;justify-content:space-between;align-items:center;padding:.95rem .2rem;border-bottom:.07rem solid var(--line);font-size:1.9rem}
.pr em{font-style:normal;direction:ltr;font-weight:900;font-variant-numeric:tabular-nums}
.pr.past{opacity:.5}
.pr.on{display:block;padding:.5rem .2rem .8rem}
.pr.on .r1{display:flex;justify-content:space-between;align-items:flex-end}
.pr.on em{font-size:3.8rem;color:var(--acc);line-height:1}
.pr.on .nm{color:var(--acc);font-weight:900;font-size:2.1rem}
.pr.on .cd{color:var(--acc);font-size:1.2rem;font-weight:700}
.pr .pb{height:.3rem;border-radius:99px;background:#ffffff2e;margin-top:.55rem;overflow:hidden}
.pr .pb i{display:block;height:100%;background:var(--acc);border-radius:99px}
body[data-mode=glass] #pr{background:var(--card);backdrop-filter:var(--bf);border:.07rem solid var(--line);border-radius:1.4rem;padding:1.1rem 1.5rem}
/* خط زمني */
#pr[data-ps=line] .tl2{position:relative;padding-inline-start:2.2rem}
#pr[data-ps=line] .tl2::before{content:"";position:absolute;top:1.4rem;bottom:1.4rem;right:.5rem;width:.12rem;background:#ffffff33}
#pr[data-ps=line] .pr{position:relative;border-bottom:0;padding:.55rem .2rem}
#pr[data-ps=line] .pr::before{content:"";position:absolute;right:-1.95rem;top:50%;width:.8rem;height:.8rem;margin-top:-.4rem;border-radius:50%;background:var(--b1);border:.15rem solid #ffffff66}
#pr[data-ps=line] .pr.past::before{background:#ffffff66}
#pr[data-ps=line] .pr.on::before{top:1.3rem;background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 .35rem #8ff0b933}
/* كبسولات */
#pr[data-ps=pills]{width:auto;left:0;right:34rem;display:flex;flex-wrap:wrap;gap:.8rem;justify-content:flex-start;align-content:flex-start}
#pr[data-ps=pills] .ttl{flex-basis:100%;border:0}
#pr[data-ps=pills] .pr{display:block;border:0;padding:.7rem 1.4rem;border-radius:99px;background:var(--card);backdrop-filter:var(--bf);text-align:center;font-size:1.1rem;font-weight:700}
#pr[data-ps=pills] .pr em{display:block;font-size:1.7rem}
#pr[data-ps=pills] .pr.on{background:var(--acc);color:#0b1a14;padding:1rem 2rem}
#pr[data-ps=pills] .pr.on .nm,#pr[data-ps=pills] .pr.on em,#pr[data-ps=pills] .pr.on .cd{color:#0b1a14;font-size:inherit}
#pr[data-ps=pills] .pr.on em{font-size:2.6rem}
#pr[data-ps=pills] .pr .pb{background:#0b1a1440}
#pr[data-ps=pills] .pr.on .pb i{background:#0b1a14}
#pr[data-ps=pills] .pr.on .r1{display:block}
/* التطبيقات */
#apps{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1.2rem;justify-content:center}
.ap{position:relative;width:16.5rem;height:4.6rem;border-radius:1.1rem;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;color:#fff;box-shadow:0 .5rem 1.4rem #0006;gap:.5rem}
.ap .no{position:absolute;top:.5rem;left:.65rem;width:1.35rem;height:1.35rem;border-radius:50%;border:.1rem solid #ffffffbf;font-size:.75rem;font-weight:400;display:grid;place-items:center;background:#00000026}
#a1{background:linear-gradient(160deg,#f0394d,#bf1f33)}
#a2{background:linear-gradient(160deg,#8d55f0,#5e2fc2)}
#a3{background:linear-gradient(160deg,#1fa37a,#0d6b50)}
body.frihide #pr,body.frihide #hm #wxb,body.frihide #lines{display:none}
#frm{display:none;position:absolute;left:38rem;right:34rem;top:17rem;text-align:center}
body.friday #frm{display:block}
body.friday .kahf{display:none!important}
body.friday #pr[data-ps=pills]~#frm{top:16rem}
#frm .du{font-size:1.6rem;line-height:2;color:var(--fg)}
#frm .kh{margin-top:1.4rem;padding-top:1.1rem;border-top:.07rem solid var(--line);font-size:1.5rem;color:var(--gold)}
.kahf{display:none;color:var(--gold);margin-top:.5rem;font-size:1rem}
body.frikahf .kahf{display:block}
/* ===== الرياضة ===== */
#p-sports .grid{position:absolute;inset:0 0 7.6rem 0;display:grid;grid-template-columns:1.15fr 1px 1fr 1px 1fr;gap:1.8rem}
#p-sports .grid.one{grid-template-columns:1fr}
.vl{background:var(--line)}
.col h4{margin:0 0 .5rem;color:var(--gold);font-size:1rem;font-weight:900}
.lg{width:2rem;height:2rem;object-fit:contain;vertical-align:middle}
.lgs{width:1.4rem;height:1.4rem;object-fit:contain;vertical-align:middle;margin-inline:.3rem}
.ah1{display:flex;align-items:center;gap:1rem}
.ah1 img{width:4rem;height:4rem;object-fit:contain}
.ah1 .nm{font-size:1.8rem;font-weight:900;line-height:1.1}
.ah1 .sb{color:var(--mut);font-size:.9rem}
.ah1 .st2{display:flex;gap:1.2rem;text-align:center}
.ah1 .st2 b{display:block;font-size:2rem;font-weight:900;line-height:1}
.ah1 .st2 small{color:var(--mut);font-size:.8rem}
.fm{display:flex;gap:.45rem;margin:.9rem 0}
.fm i{font-style:normal;width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:900;color:#0b1117}
.fm .W{background:#4ade80}.fm .D{background:#9aa7b3}.fm .L{background:#f87171}
.rs{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:.07rem solid var(--line);font-size:1rem}
.rs b{direction:ltr;display:inline-block;margin:0 .4rem}
.tag{font-size:.75rem;padding:.12rem .6rem;border-radius:99px;color:#0b1117;font-weight:900}
.tag.W{background:#4ade80}.tag.D{background:#9aa7b3}.tag.L{background:#f87171}
.nx{margin-top:1rem;color:var(--gold)}
.nx .s1{font-size:.8rem}
.nx b{display:block;color:#fff;font-size:1.4rem;font-weight:900;margin:.15rem 0}
.nx .s2{font-size:.95rem}
.win{position:relative;overflow:hidden;margin-bottom:.9rem;padding:.7rem 1rem;border-radius:1rem;background:linear-gradient(120deg,rgba(241,220,154,.28),rgba(143,240,185,.16));border:.07rem solid rgba(241,220,154,.5)}
.win .w1{font-size:1.35rem;font-weight:900;color:var(--gold)}
.win .w2{font-size:.9rem}
.mrow{display:flex;align-items:center;gap:.8rem;padding:.6rem 0;border-bottom:.07rem solid var(--line);font-size:1.02rem}
.mrow .t{width:5.4rem;white-space:nowrap;color:var(--gold);font-weight:900;direction:ltr;text-align:right;font-size:.95rem}
.mrow .pr2{flex:1;display:flex;align-items:center;justify-content:space-between;gap:.4rem;min-width:0}
.mrow .pr2 span{white-space:nowrap}
.mrow .sc{direction:ltr;font-weight:900;color:var(--mut)}
.mrow .stt{width:5.6rem;font-size:.78rem;color:var(--mut);text-align:left;white-space:nowrap}
.mrow.live .stt{color:#ff7b7b;font-weight:900}
.mrow.live .sc{color:#fff}
.mrow.done{opacity:.55}
.erow{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:.07rem solid var(--line)}
.erow small{display:block;color:var(--gold);font-size:.75rem}
.erow .tt{font-size:1.05rem;font-weight:700}
.erow .wh2{color:var(--mut);font-size:.82rem;white-space:nowrap}
#rank{position:absolute;left:0;right:0;bottom:0;height:6.6rem;border-top:.07rem solid var(--line);padding-top:.7rem;display:flex;flex-direction:column;gap:.5rem}
#rank .tt{color:var(--gold);font-size:.85rem;font-weight:900}
#rank .rr{display:flex;justify-content:space-between;gap:.5rem}
#rank .it{flex:1;text-align:center;padding:.4rem .2rem;border-radius:.8rem;min-width:0}
#rank .it.me{background:#f1dc9a26;border:.07rem solid #f1dc9a66}
#rank .it b{display:block;font-size:1.1rem;font-weight:900}
#rank .it small{display:block;color:var(--mut);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rank .it img{width:1.7rem;height:1.7rem;object-fit:contain;display:block;margin:.15rem auto}
.empty{color:var(--mut);padding:1rem 0;font-size:1rem}
/* ===== صفحة الأهلي وقت المباراة ===== */
#p-sports .mt{position:absolute;inset:0;display:none}
body.matchpage #p-sports .grid,body.matchpage #p-sports #rank{display:none}
body.matchpage #p-sports .mt{display:block}
.mt .cmp{position:absolute;top:.2rem;left:0;right:0;text-align:center;color:var(--gold);font-size:1rem}
.mt .sc3{position:absolute;top:2rem;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:2.4rem}
.mt .tm{text-align:center;width:14rem}
.mt .tm .lw{width:6.4rem;height:6.4rem;margin:0 auto}
.mt .tm img{width:100%;height:100%;object-fit:contain}
.mt .tm b{display:block;font-size:1.6rem;font-weight:900;margin-top:.5rem}
.mt .big{font-size:7.6rem;font-weight:900;direction:ltr;letter-spacing:.3rem;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.mt .stx{text-align:center;font-size:1.25rem;font-weight:900;margin-top:.4rem}
.mt .stx.live{color:#ff7b7b}
.mt .pill{display:inline-block;margin-top:.5rem;padding:.4rem 1.6rem;border-radius:99px;background:linear-gradient(120deg,rgba(241,220,154,.32),rgba(143,240,185,.2));border:.07rem solid rgba(241,220,154,.55);font-size:1.4rem;font-weight:900;color:var(--gold)}
.mt .low{position:absolute;left:0;right:0;top:23rem;display:flex;justify-content:center;gap:3rem;transition:opacity .6s}
.mt .low>div{width:30rem}
.mt .low h4{margin:0 0 .4rem;color:var(--gold);font-size:1rem}
.evr{display:flex;gap:.9rem;align-items:center;padding:.55rem 0;border-bottom:.07rem solid var(--line);font-size:1rem}
.evr b{width:3rem;color:var(--gold);direction:ltr;text-align:right}
#stage2{position:absolute;left:0;right:0;top:19rem;height:17rem;display:none}
#stage2 .scn{position:absolute;left:calc(50% - 41rem);top:0;width:32.5rem;height:15.6rem;transform-origin:top left}
#stage2 .scn .pl{position:absolute;left:14.75rem;top:-1.1rem;width:18.75rem;height:19.4rem;transform:scale(.8);transform-origin:top left}
#stage2 .kl{transform-box:view-box;transform-origin:176px 190px}
#rp{position:absolute;left:0;bottom:-1rem;display:none;align-items:center;gap:.6rem;padding:.55rem 1.3rem;border-radius:99px;border:.14rem solid var(--gold);background:#0006;font-size:1rem;font-weight:700}
#cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
#cf i{position:absolute;top:-1rem;border-radius:1px}
.dropper{position:relative}
/* ===== الأخبار ===== */
#p-news .nw{position:absolute;inset:0;overflow:hidden;max-width:96rem}
.nw .nr{display:flex;gap:1.1rem;align-items:center;padding:1.05rem .3rem;border-bottom:.07rem solid var(--line)}
.nw .nr::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--gold);flex:none}
.nw .nr.b1{font-size:1.7rem;font-weight:900;line-height:1.5}
.nw .nr.b2{font-size:1.25rem;line-height:1.5}
.nw h4{margin:0 0 .3rem;color:var(--gold);font-size:1rem}
/* ===== الإعدادات ===== */
#p-settings{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:.3rem .4rem 3rem}
#p-settings::-webkit-scrollbar{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2.6rem;align-items:start}
.sec{margin-bottom:1.5rem}
.sec h3{margin:0 0 .6rem;color:var(--gold);font-size:1.05rem;font-weight:900}
.row{display:flex;align-items:center;gap:.9rem;padding:.5rem .9rem;margin-bottom:.45rem;min-height:2.9rem;background:var(--card);backdrop-filter:var(--bf);border:.07rem solid var(--line);border-radius:.9rem;font-size:1.05rem}
.row:focus-within{border-color:var(--gold);background:#f1dc9a24;box-shadow:0 0 0 .14rem var(--gold)}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--mut);font-size:.78em;margin-top:.1rem}

.tgl{width:2.7rem;height:1.5rem;border-radius:99px;border:0;background:#ffffff2b;position:relative;padding:0;flex:none}
.tgl::after{content:"";position:absolute;top:.17rem;right:.17rem;width:1.16rem;height:1.16rem;border-radius:50%;background:#fff;transition:.2s}

.tgl[aria-checked=true]::after{right:1.4rem;background:#1a1a1a}
.chk{display:flex;gap:.4rem}
.cp{border:.1rem solid var(--line);background:none;color:var(--mut);padding:.22rem .8rem;border-radius:99px;font-size:.9rem}

.cp[aria-checked=true]::before{content:"✓ "}
.btn{border:.1rem solid var(--line);background:none;padding:.25rem 1rem;border-radius:99px;font-size:.9rem}
.btn.on{background:var(--gold);color:#1a1a1a;font-weight:900}
.btn.danger[data-arm=on]{background:#f87171;color:#1a1a1a;border-color:#f87171;font-weight:900}
.dots{display:flex;gap:.6rem}
.dt{width:1.6rem;height:1.6rem;border-radius:50%;border:.17rem solid transparent;padding:0}
.dt[aria-pressed=true]{border-color:var(--gold)}
.st{display:flex;align-items:center;gap:.8rem;padding:.4rem .9rem;margin-bottom:.35rem;background:var(--card);backdrop-filter:var(--bf);border:.07rem solid var(--line);border-radius:.9rem;font-size:1rem}
.st i{width:.85rem;height:.85rem;border-radius:50%;flex:none;background:#8a98a8}
.st.g i{background:#4ade80;box-shadow:0 0 .5rem #4ade8088}.st.y i{background:#facc15;box-shadow:0 0 .5rem #facc1588}.st.r i{background:#f87171;box-shadow:0 0 .5rem #f8717188}
.st .nm{flex:1}
.st .tm2{color:var(--mut);font-size:.88rem}
.st .why{flex-basis:100%;margin:-.15rem 0 0 0;padding-inline-start:1.65rem;color:#ffb4b4;font-size:.82rem}
.st.w{flex-wrap:wrap}
.st.y .why{color:#fde68a}
#toast{position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#000000cc;border:.07rem solid var(--gold);color:#fff;padding:.6rem 1.6rem;border-radius:99px;font-size:1.05rem;opacity:0;transition:.3s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.row.mu{flex-wrap:wrap;row-gap:.55rem}.row.mu .n{flex-basis:100%}.row.mu .gp{margin-inline-end:.4rem}.gp{display:inline-flex;align-items:center;gap:.5rem;color:var(--mut);font-size:.88rem}
#p-settings .row,#p-settings .st{backdrop-filter:none}
#sbar{display:flex;gap:.7rem;margin-bottom:1rem;position:sticky;top:0;z-index:2;padding:.2rem 0 .5rem}
.stab{border:.1rem solid var(--line);background:#00000030;color:var(--mut);padding:.4rem 1.3rem;border-radius:99px;font-size:1.05rem;font-weight:700}
.stab.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}

  if(t==='fresh')return startTest(t,15000,()=>{forceFresh='g';renderFresh();showPage('home');TEST.iv=setInterval(()=>{const o=['g','y','r'];forceFresh=o[(o.indexOf(forceFresh)+1)%3];renderFresh()},4000)},'تجربة لون المؤشر ١٥ ثانية');
  if(t==='off')return startTest(t,15000,()=>{forceOff=true;renderStatus();renderAll();showPage('home')},'محاكاة انقطاع الإنترنت ١٥ ثانية');
  if(t==='fri')return startTest(t,20000,()=>{forceFri=true;modes();renderAll();showPage('home')},'تجربة صفحة الجمعة ٢٠ ثانية');
  if(t==='rain')return startTest(t,20000,()=>{forceRain=true;modes();renderAll();showPage('home')},'تجربة المطر ٢٠ ثانية');
  if(t==='match')return startTest(t,30000,()=>{forceMatch='live';SPM='ahli';lastMt='';resetScene();sceneFor='';showPage('sports');renderSports();focusTab('sports')},'تجربة مباراة مباشرة ٣٠ ثانية');
  if(t==='win')return startTest(t,10000,()=>{forceMatch='win';SPM='ahli';lastMt='';resetScene();sceneFor='';showPage('sports');renderSports();focusTab('sports')},'تجربة مبروك الفوز');
}
/* ---------- المطر فوق الخلفية (الرئيسية فقط) ---------- */
const RC=$('rain'),rctx=RC.getContext('2d');let rainOn=false,drops=[],rafId=0,lastF=0;
function nd(r){return{x:Math.random()*RC.width,y:r?Math.random()*RC.height:-30,l:16+Math.random()*24,v:800+Math.random()*700,a:.22+Math.random()*.35}}
function rainCtl(){
  const want=!!RAIN&&PAGE==='home';
  if(want&&!rainOn){rainOn=true;RC.width=innerWidth;RC.height=innerHeight;drops=Array.from({length:110},()=>nd(true));lastF=0;rafId=requestAnimationFrame(rainFrame)}
  else if(!want&&rainOn){rainOn=false;cancelAnimationFrame(rafId);rctx.clearRect(0,0,RC.width,RC.height)}
}
function rainFrame(t){
  if(!rainOn)return;rafId=requestAnimationFrame(rainFrame);
  if(lastF&&t-lastF<32)return;const dt=lastF?Math.min(.06,(t-lastF)/1000):.03;lastF=t;
  rctx.clearRect(0,0,RC.width,RC.height);rctx.strokeStyle='#d6e9ff';rctx.lineWidth=1.6;rctx.lineCap='round';
  for(const d of drops){rctx.globalAlpha=d.a;rctx.beginPath();rctx.moveTo(d.x,d.y);rctx.lineTo(d.x-d.l*.18,d.y+d.l);rctx.stroke();
    d.y+=d.v*dt;d.x-=d.v*dt*.18;if(d.y>RC.height+30||d.x<-30)Object.assign(d,nd(false))}
  rctx.globalAlpha=1;
}
window.addEventListener('resize',()=>{if(rainOn){RC.width=innerWidth;RC.height=innerHeight}});
/* ---------- العودة التلقائية للرئيسية + حماية الشاشة ---------- */
let lastAct=Date.now();['keydown','mousemove','click'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
function idleCheck(){
  if(TEST||alertOn)return;const idle=Date.now()-lastAct;
  if((PAGE==='sports'&&idle>12e4)||(PAGE==='settings'&&idle>3e5)){
    if(SCARD)closeCard();SPM='';showPage('home');const t=$$('.tab')[0];t&&t.focus();
  }
}
const BURN=[[0,0],[3,2],[-3,3],[2,-3],[-2,-2]];let bi=0;
setInterval(()=>{bi=(bi+1)%BURN.length;$('app').style.transform=`translate(${BURN[bi][0]}px,${BURN[bi][1]}px)`},180000);
/* ---------- التشغيل ---------- */
function renderSlow(){
  safe(renderWeather);safe(renderLines);safe(renderPrayer);safe(renderFresh);
}
function renderAll(){
  safe(modes);safe(renderClock);renderSlow();safe(renderSports);safe(renderStatus);safe(renderCards);
}
buildSettings();
let tickN=0;
setInterval(()=>{
  safe(renderClock);safe(renderPrayer);safe(checkAlert);if(tickN%5===0)idleCheck();
  if(++tickN%20===0){safe(modes);safe(renderWeather);safe(renderLines);safe(renderFresh);if(PAGE==='sports')safe(renderSports);if(PAGE==='settings'){safe(renderStatus);safe(renderCards)}safe(pollLive)}
},1000);
window.addEventListener('online',()=>loadData());window.addEventListener('offline',()=>{renderAll()});
applyS();renderAll();showPage('home');
loadBgList();bgSched();sched();loadData();
