<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة الجلوس</title>
<style>
/* خطوط ثمانية — استخدام شخصي بإذن من ثمانية (ثلاثة أوزان فقط) */
@font-face{font-family:ThmanyahApp;font-weight:400;font-display:swap;src:url(thmanyahsans-Regular.woff2) format('woff2')}
@font-face{font-family:ThmanyahApp;font-weight:700;font-display:swap;src:url(thmanyahsans-Bold.woff2) format('woff2')}
@font-face{font-family:ThmanyahApp;font-weight:900;font-display:swap;src:url(thmanyahsans-Black.woff2) format('woff2')}
@font-face{font-family:ThmanyahDisp;font-weight:700;font-display:swap;src:url(thmanyahserifdisplay-Bold.woff2) format('woff2')}
@font-face{font-family:ThmanyahDisp;font-weight:900;font-display:swap;src:url(thmanyahserifdisplay-Black.woff2) format('woff2')}
:root{--fs:1;--gold:#f1dc9a;--mint:#8ff0b9;--fg:#eef2f6;--mut:#aab8c6;--line:#ffffff26;--card:#ffffff10;--blur:0px;--b0:#233a5c;--b1:#121e33;--b2:#080d18}
body[data-theme=teal]{--b0:#1d4a47;--b1:#0f2a2c;--b2:#071517}
body[data-theme=warm]{--b0:#4a423a;--b1:#2a2622;--b2:#15120f}
body[data-mode=glass]{--card:#ffffff1c;--blur:18px;--line:#ffffff30}
html{font-size:calc(min(100vw/120,100vh/67.5)*var(--fs))}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--fg);font-family:ThmanyahApp,Tajawal,"Segoe UI",Tahoma,sans-serif;font-weight:400;background:var(--b2);cursor:none}
body.mouse{cursor:auto}
body[data-font=display]{font-family:ThmanyahDisp,ThmanyahApp,Tajawal,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background:linear-gradient(160deg,var(--b0) 0%,var(--b1) 55%,var(--b2) 100%)}
body[data-mode=glass] #bg{background:radial-gradient(120% 90% at 20% 0%,var(--b0),var(--b1) 55%,var(--b2))}
#scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.7));opacity:0}
body.hasphoto #scrim{opacity:1}
body[data-dim=low] #scrim{filter:opacity(.6)}
body[data-dim=high] #scrim{filter:brightness(.6) contrast(1.2)}
#app{position:fixed;inset:0;transition:transform 4s ease}
/* ===== الشريط العلوي ===== */
#top{position:absolute;top:2.2rem;left:3rem;right:3rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;z-index:3}
#hclock{justify-self:start;min-width:12rem}
body[data-page=home] #hclock{visibility:hidden}
.ck{direction:ltr;display:flex;align-items:flex-end;justify-content:flex-end;gap:.45rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.ck small{font-size:.26em;font-weight:700;margin-bottom:.14em;opacity:.9}
#hclock .ck{font-size:3.4rem}
#hclock .dl{font-size:.95rem;color:var(--mut);margin-top:.35rem;text-align:right}
.dl b{color:var(--gold);font-weight:700}
#tabs{display:flex;gap:2.4rem;padding-top:.4rem}
.tab{background:none;border:0;padding:.35rem .2rem;font-size:1.55rem;font-weight:400;color:var(--mut);border-bottom:.2rem solid transparent;text-shadow:0 1px 10px #0007;transition:color .2s}
.tab.on{color:#fff;font-weight:700;border-bottom-color:var(--gold)}
body[data-mode=glass] .tab.on{border-bottom-color:transparent;background:#ffffff2b;border-radius:99px;padding:.35rem 1.2rem;margin:0 -1rem}
#tools{justify-self:end;display:flex;gap:1.1rem;align-items:center;padding-top:.5rem}
.tl{width:3.1rem;height:3.1rem;border-radius:50%;border:.14rem solid transparent;background:none;display:grid;place-items:center;padding:0;font-size:1.7rem;opacity:.9;position:relative}
.tl svg{width:55%;height:55%}
#rf{border-color:var(--fc,#ffffff40)}
#rf.spin span{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.st-g{--fc:#4ade80}body.st-y{--fc:#facc15}body.st-r{--fc:#f87171}
#rf::after{content:"";position:absolute;top:.1rem;right:.1rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--fc,transparent);box-shadow:0 0 .6rem var(--fc,transparent)}
:is(button,a):focus-visible{outline:.22rem solid var(--gold);outline-offset:.25rem;border-radius:.6rem}
.tl:focus-visible{border-radius:50%}
/* ===== الصفحات ===== */
#pages{position:absolute;top:7.6rem;left:3rem;right:3rem;bottom:2rem}
.pg{position:absolute;inset:0;display:none}
body[data-page=home] #p-home,body[data-page=sports] #p-sports,body[data-page=news] #p-news,body[data-page=settings] #p-settings{display:block}
.ph{position:absolute;left:0;right:0;bottom:1rem;text-align:center;color:var(--mut);font-size:1.15rem}
.ph div{display:inline-block;padding:1rem 2rem;border:.1rem dashed var(--line);border-radius:1.2rem;backdrop-filter:blur(var(--blur))}
.ph b{color:var(--gold)}
#hm{position:absolute;top:-4.2rem;right:0;text-align:right;width:30rem}
#gr{color:var(--gold);font-size:1.5rem;font-weight:700;text-shadow:0 1px 12px #0008}
#hm .ck{font-size:10.5rem;margin-top:.1rem;text-shadow:0 2px 24px #0008}
#hm .dl{font-size:1.25rem;margin-top:.6rem;color:var(--fg);text-shadow:0 1px 12px #0008}
#hm .dl2{font-size:.95rem;color:var(--mut);margin-top:.2rem}
/* ===== الإعدادات ===== */
#p-settings{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:.3rem .4rem 3rem;scroll-behavior:smooth}
#p-settings::-webkit-scrollbar{display:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:2.6rem;align-items:start}
.sec{margin-bottom:1.5rem}
.sec h3{margin:0 0 .6rem;color:var(--gold);font-size:1.05rem;font-weight:900}
.row{display:flex;align-items:center;gap:.9rem;padding:.5rem .9rem;margin-bottom:.45rem;min-height:2.9rem;background:var(--card);backdrop-filter:blur(var(--blur));border:.07rem solid var(--line);border-radius:.9rem;font-size:1.05rem}
.row:focus-within{border-color:var(--gold);background:#f1dc9a24;box-shadow:0 0 0 .14rem var(--gold)}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--mut);font-size:.78em;margin-top:.1rem}
.seg{display:flex;background:#00000040;border-radius:99px;padding:.18rem;gap:.1rem}
.sg{border:0;background:none;color:var(--mut);padding:.22rem .85rem;border-radius:99px;font-size:.9rem;font-weight:400;white-space:nowrap}
.sg[aria-pressed=true]{background:var(--gold);color:#1a1a1a;font-weight:900}
.tgl{width:2.7rem;height:1.5rem;border-radius:99px;border:0;background:#ffffff2b;position:relative;padding:0;flex:none}
.tgl::after{content:"";position:absolute;top:.17rem;right:.17rem;width:1.16rem;height:1.16rem;border-radius:50%;background:#fff;transition:.2s}
.tgl[aria-checked=true]{background:var(--gold)}
.tgl[aria-checked=true]::after{right:1.4rem;background:#1a1a1a}
.chk{display:flex;gap:.4rem}
.cp{border:.1rem solid var(--line);background:none;color:var(--mut);padding:.22rem .8rem;border-radius:99px;font-size:.9rem}
.cp[aria-checked=true]{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:900}
.cp[aria-checked=true]::before{content:"✓ "}
.btn{border:.1rem solid var(--line);background:none;padding:.25rem 1rem;border-radius:99px;font-size:.9rem}
.btn.danger[data-arm=on]{background:#f87171;color:#1a1a1a;border-color:#f87171;font-weight:900}
.dots{display:flex;gap:.6rem}
.dt{width:1.6rem;height:1.6rem;border-radius:50%;border:.17rem solid transparent;padding:0}
.dt[aria-pressed=true]{border-color:var(--gold)}
/* حالة الاتصال */
.st{display:flex;align-items:center;gap:.8rem;padding:.4rem .9rem;margin-bottom:.35rem;background:var(--card);backdrop-filter:blur(var(--blur));border:.07rem solid var(--line);border-radius:.9rem;font-size:1rem}
.st i{width:.85rem;height:.85rem;border-radius:50%;flex:none;background:#8a98a8}
.st.g i{background:#4ade80;box-shadow:0 0 .5rem #4ade8088}.st.y i{background:#facc15;box-shadow:0 0 .5rem #facc1588}.st.r i{background:#f87171;box-shadow:0 0 .5rem #f8717188}
.st .nm{flex:1}
.st .tm{color:var(--mut);font-size:.88rem}
.st .why{flex-basis:100%;margin:-.15rem 0 0 0;padding-inline-start:1.65rem;color:#ffb4b4;font-size:.82rem}
.st.w{flex-wrap:wrap}
.st.y .why{color:#fde68a}
#toast{position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#000000cc;border:.07rem solid var(--gold);color:#fff;padding:.6rem 1.6rem;border-radius:99px;font-size:1.05rem;opacity:0;transition:.3s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-page="home" data-mode="pure" data-theme="blue" data-dim="mid">
<div id="bg"></div><div id="scrim"></div>
<div id="app">
  <header id="top">
    <div id="hclock"><div class="ck" id="hck"></div><div class="dl" id="hdl"></div></div>
    <nav id="tabs" role="tablist" aria-label="التنقل">
      <button class="tab on" data-p="home" role="tab">الرئيسية</button>
      <button class="tab" data-p="sports" role="tab">الرياضة</button>
      <button class="tab" data-p="news" role="tab">الأخبار</button>
      <button class="tab" data-p="settings" role="tab">الإعدادات</button>
    </nav>
    <div id="tools">
      <button class="tl" id="rf" aria-label="تحديث البيانات"><span>&#8635;</span></button>
      <button class="tl" id="bgn" aria-label="تغيير الخلفية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="tl" id="ex" aria-label="إغلاق التطبيق" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <main id="pages">
    <section class="pg" id="p-home">
      <div id="hm"><div id="gr"></div><div class="ck" id="bck"></div><div class="dl" id="bdl"></div><div class="dl2" id="bdl2"></div></div>
      <div class="ph"><div>الصلاة · الطقس · الراتب · التطبيقات — <b>المرحلة ٢</b></div></div>
    </section>
    <section class="pg" id="p-sports"><div class="ph"><div>مباريات الأهلي وروشن وأوروبا والترتيب — <b>المرحلة ٣</b></div></div></section>
    <section class="pg" id="p-news"><div class="ph"><div>عناوين الأخبار — <b>المرحلة ٣</b></div></div></section>
    <section class="pg" id="p-settings"><div class="cols"><div id="c1"></div><div id="c2"></div></div></section>
  </main>
</div>
<div id="toast"></div>
<script>
/*DATA-START*/
const DATA={};
/*DATA-END*/
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const IN_APP=!!window.TabukApp||/[?&]app=1/.test(location.search);
const ZONE='Asia/Riyadh',pad=n=>String(n).padStart(2,'0');
/* ---------- حماية: أي قسم ينهار لا يوقف الباقي ---------- */
const safe=(fn,...a)=>{try{return fn(...a)}catch(e){console.warn('قسم تعطّل:',fn.name,e);return null}};
/* ---------- الإعدادات (تُطبَّق فوراً) ---------- */
const DEF={design:'asri',mode:'pure',dim:'mid',motion:'off',bg:1,bgint:30,theme:'blue',font:'sans',fs:1,
  sRosh:1,sAhli:1,sEu:1,weather:'now5',news:1,prayers:1,pstyle:'strip',countdown:1,salary:1,apps:1,friday:1,rain:1,alert:'sound',vol:70,refresh:15};
let S;try{S={...DEF,...JSON.parse(localStorage.getItem('tabukN')||'{}')}}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem('tabukN',JSON.stringify(S))}catch(e){}};
const SEGS={
 design:[['classic','كلاسيك'],['asri','عصري']],
 mode:[['pure','صافي'],['glass','زجاجي']],
 dim:[['low','خفيف'],['mid','متوسط'],['high','قوي']],
 motion:[['off','إيقاف'],['soft','خفيفة']],
 bgint:[[10,'١٠ د'],[30,'٣٠ د'],[60,'ساعة']],
 font:[['sans','نظيف'],['display','عناوين']],
 fs:[[.9,'صغير'],[1,'عادي'],[1.12,'كبير']],
 weather:[['off','إيقاف'],['now','الآن'],['now5','+٥ ساعات'],['detail','+ تفاصيل']],
 pstyle:[['strip','شريط'],['line','خط زمني'],['pills','كبسولات']],
 alert:[['off','إيقاف'],['toast','إشعار فقط'],['sound','إشعار + صوت']],
 vol:[[40,'منخفض'],[70,'متوسط'],[100,'عالٍ']],
 refresh:[[0,'إيقاف'],[5,'٥ د'],[15,'١٥ د'],[60,'ساعة']]};
const THEMES=[['blue','أزرق ليلي','#233a5c'],['teal','أخضر مزرق','#1d4a47'],['warm','رمادي دافئ','#4a423a']];
const seg=k=>`<span class="seg">`+SEGS[k].map(([v,l])=>`<button class="sg" data-s="${k}" data-v="${v}" aria-pressed="false">${l}</button>`).join('')+`</span>`;
const tg=k=>`<button class="tgl" role="switch" data-k="${k}" aria-checked="false" aria-label="${k}"></button>`;
const rw=(n,c,sub)=>`<div class="row"><span class="n">${n}${sub?`<small>${sub}</small>`:''}</span>${c}</div>`;
function buildSettings(){
  $('c1').innerHTML=
   `<div class="sec"><h3>التصميم والمظهر</h3>`
   +rw('التصميم',seg('design'))+rw('النمط',seg('mode'))
   +rw('تعتيم الخلفية',seg('dim'))+rw('حركة الخلفية',seg('motion'))
   +rw('صور الخلفية',seg('bgint')+tg('bg'))
   +rw('لون الخلفية',`<span class="dots">`+THEMES.map(([v,l,c])=>`<button class="dt" data-s="theme" data-v="${v}" aria-pressed="false" aria-label="${l}" style="background:${c}"></button>`).join('')+`</span>`)
   +rw('نوع الخط',seg('font'))+rw('حجم الخط',seg('fs'))+`</div>`
   +`<div class="sec"><h3>الأقسام</h3>`
   +rw('الرياضة',`<span class="chk"><button class="cp" role="checkbox" data-k="sRosh" aria-checked="false">روشن</button><button class="cp" role="checkbox" data-k="sAhli" aria-checked="false">الأهلي</button><button class="cp" role="checkbox" data-k="sEu" aria-checked="false">أوروبا</button></span>`)
   +rw('الطقس',seg('weather'))+rw('الأخبار',tg('news'))
   +rw('أوقات الصلاة',seg('pstyle')+tg('prayers'))+rw('العد التنازلي للصلاة',tg('countdown'))
   +rw('مواعيد الراتب',tg('salary'))+rw('أزرار التطبيقات',tg('apps'))
   +rw('وضع الجمعة',tg('friday'))+rw('وضع المطر',tg('rain'))+`</div>`;
  $('c2').innerHTML=
   `<div class="sec"><h3>حالة الاتصال</h3><div id="stl"></div>${rw('تحديث الآن',`<button class="btn" id="rf2">تحديث</button>`)}</div>`
   +`<div class="sec"><h3>تنبيه موعد الصلاة</h3>`+rw('التنبيه',seg('alert'))+rw('مستوى الصوت',seg('vol'))
   +rw('تجربة التنبيه',`<button class="btn" data-test="alert">تجربة</button>`,'تعمل في المرحلة ٤')+`</div>`
   +`<div class="sec"><h3>تجربة العروض</h3>`
   +rw('لون مؤشر الحداثة',`<button class="btn" data-test="fresh">تغيير</button>`,'أخضر ← أصفر ← أحمر ← الوضع الحقيقي')
   +rw('انقطاع الإنترنت',`<button class="btn" data-test="off">تجربة</button>`,'يعرض آخر بيانات محفوظة')
   +rw('صفحة الجمعة',`<button class="btn" data-test="fri">تجربة</button>`,'المرحلة ٤')
   +rw('وضع المطر',`<button class="btn" data-test="rain">تجربة</button>`,'المرحلة ٤')
   +rw('صفحة الأهلي وقت المباراة',`<button class="btn" data-test="match">تجربة</button>`,'المرحلة ٤')
   +rw('مبروك الفوز ومشهد الركل',`<button class="btn" data-test="win">تجربة</button>`,'المرحلة ٤')+`</div>`
   +`<div class="sec"><h3>النظام</h3>`+rw('تحديث البيانات تلقائياً',seg('refresh'))
   +rw('استعادة الإعدادات الافتراضية',`<button class="btn danger" id="rst">استعادة</button>`)+`</div>`;
  $('rf2').onclick=()=>loadData(true);
  $('rst').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm==='on'){S={...DEF};save();applyS();toast('تمت استعادة الإعدادات الافتراضية');disarm()}else{b.dataset.arm='on';b.textContent='اضغط مرة ثانية للتأكيد';clearTimeout(armT);armT=setTimeout(disarm,4000)}};
}
let armT;function disarm(){const b=$('rst');if(b){delete b.dataset.arm;b.textContent='استعادة'}}
function syncSettings(){
  $$('[data-s]').forEach(b=>b.setAttribute('aria-pressed',String(String(S[b.dataset.s])===b.dataset.v)));
  $$('[data-k]').forEach(b=>b.setAttribute('aria-checked',String(!!S[b.dataset.k])));
}
function applyS(){
  const B=document.body;
  B.dataset.mode=S.mode;B.dataset.theme=S.theme;B.dataset.dim=S.dim;B.dataset.font=S.font;
  document.documentElement.style.setProperty('--fs',S.fs);
  syncSettings();
  if(S.design==='classic'&&!/[?&]stay=1/.test(location.search))classicNote();
  safe(renderStatus);
}
function classicNote(){toast('التصميم الكلاسيك يُدمج في المرحلة ٦ — الآن تعرض «عصري» فقط');S.design='asri';save();syncSettings()}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-s]');
  if(g){const k=g.dataset.s,v=g.dataset.v;S[k]=(v!==''&&!isNaN(+v))?+v:v;save();applyS();return}
  const b=e.target.closest('[data-k]');
  if(b){const k=b.dataset.k;S[k]=S[k]?0:1;save();applyS();return}
  const t=e.target.closest('[data-test]');
  if(t)runTest(t.dataset.test);
});
/* ---------- الصفحات والتنقل ---------- */
let PAGE='home';
function showPage(p){PAGE=p;document.body.dataset.page=p;$$('.tab').forEach(t=>{t.classList.toggle('on',t.dataset.p===p);t.setAttribute('aria-selected',t.dataset.p===p)});if(p==='settings')safe(renderStatus)}
$$('.tab').forEach(t=>{t.addEventListener('click',()=>showPage(t.dataset.p));t.addEventListener('focus',()=>showPage(t.dataset.p))});
function vis(e){const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&!e.closest('[hidden]')}
function focusables(){return $$('button:not([hidden]),a[href]').filter(vis)}
function move(dir){
  const cur=document.activeElement,els=focusables();
  if(!cur||!els.includes(cur)){const t=$$('.tab.on')[0]||els[0];t&&t.focus();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  for(const e of els){if(e===cur)continue;const q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
    const ok=dir==='left'?dx<-3:dir==='right'?dx>3:dir==='up'?dy<-3:dy>3;if(!ok)continue;
    const h=dir==='left'||dir==='right',s=(h?Math.abs(dx):Math.abs(dy))+(h?Math.abs(dy):Math.abs(dx))*2.5;
    if(s<bs){bs=s;best=e}}
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
}
document.addEventListener('focusin',e=>{const p=$('p-settings');if(p.contains(e.target)){const r=e.target.getBoundingClientRect(),pr=p.getBoundingClientRect();if(r.top<pr.top+20||r.bottom>pr.bottom-20)e.target.scrollIntoView({block:'center'})}});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(m){e.preventDefault();move(m);return}
  if(e.key==='0'||e.code==='Digit0'||e.code==='Numpad0'){e.preventDefault();showPage('settings');const t=$$('.tab').find(x=>x.dataset.p==='settings');t&&t.focus();return}
  if(e.key==='Escape'||e.key==='Backspace'){if(PAGE!=='home'){e.preventDefault();showPage('home');const t=$$('.tab')[0];t&&t.focus()}}
});
let mT;document.addEventListener('mousemove',()=>{document.body.classList.add('mouse');clearTimeout(mT);mT=setTimeout(()=>document.body.classList.remove('mouse'),3000)});
/* ---------- زر الخروج (داخل التطبيق فقط) ---------- */
$('ex').hidden=!IN_APP;
$('ex').addEventListener('click',()=>{try{window.TabukApp&&window.TabukApp.exit()}catch(e){}if(!window.TabukApp)toast('زر الخروج يعمل داخل التطبيق فقط')});
/* ---------- الوقت والتاريخ ---------- */
const hmFmt=new Intl.DateTimeFormat('en-GB',{timeZone:ZONE,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{timeZone:ZONE,day:'numeric',month:'long',year:'numeric'});
const greg=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{timeZone:ZONE,weekday:'long',day:'numeric',month:'long',year:'numeric'});
function renderClock(){
  const now=Date.now(),[h,m]=hmFmt.format(now).split(':').map(Number);
  const ck=`<small>${h<12?'ص':'م'}</small><span>${h%12||12}:${pad(m)}</span>`;
  $('hck').innerHTML=ck;$('bck').innerHTML=ck;
  const hj=hijri.format(now),gr=greg.format(now);
  $('hdl').innerHTML=`<b>تبوك</b> · ${hj}`;
  $('bdl').innerHTML=`<b style="color:var(--gold)">تبوك</b> · ${hj}`;$('bdl2').textContent=gr;
  $('gr').textContent=h>=4&&h<12?'صباح الخير':h>=12&&h<18?'طاب يومك':'مساء الخير';
}
/* ---------- جلب البيانات + نسخة احتياطية ---------- */
const ST={net:null,data:{ok:null,at:0,err:''},wx:{ok:null,at:0,err:''},fetched:0};
try{const c=JSON.parse(localStorage.getItem('tabukD')||'null');if(c&&c.d){Object.assign(DATA,c.d);ST.cached=c.at}}catch(e){}
let forceFresh=null,forceOff=false;
const WMO=c=>c===0?'clear':c<=2?'partly':c===3?'cloud':((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)?'rain':'cloud';
async function wxFetch(){
  try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=28.3835&longitude=36.5662&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&forecast_days=2&timezone=Asia%2FRiyadh');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),c=j.current;DATA.wx={t:c.temperature_2m,c:WMO(c.weather_code),at:c.time};
    if(j.hourly&&j.hourly.time)DATA.hrs=j.hourly.time.map((t,i)=>({t,tt:j.hourly.temperature_2m[i],c:WMO(j.hourly.weather_code[i]),p:j.hourly.precipitation_probability[i]||0}));
    ST.wx={ok:true,at:Date.now(),err:''};return true}
  catch(e){ST.wx={ok:false,at:ST.wx.at,err:navigator.onLine===false?'لا يوجد إنترنت':'تعذّر الوصول لمصدر الطقس'};return false}
}
async function loadData(manual){
  const rf=$('rf');rf.classList.add('spin');ST.fetched=Date.now();
  try{
    if(forceOff)throw new Error('offline-test');
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();Object.assign(DATA,j);ST.data={ok:true,at:Date.now(),err:''};
    try{localStorage.setItem('tabukD',JSON.stringify({at:Date.now(),d:j}))}catch(e){}
  }catch(e){
    ST.data={ok:false,at:ST.data.at,err:forceOff||navigator.onLine===false?'لا يوجد اتصال بالإنترنت':'تعذّر تحميل ملف البيانات'};
  }
  if(forceOff){ST.wx={ok:false,at:ST.wx.at,err:'لا يوجد اتصال بالإنترنت'}}else await wxFetch();
  safe(renderStatus);setTimeout(()=>rf.classList.remove('spin'),600);
  if(manual)toast(ST.data.ok?'تم التحديث':'تعذّر التحديث — تُعرض آخر بيانات محفوظة');
}
const genMs=()=>DATA.generated?Date.parse(DATA.generated+':00+03:00'):(DATA.updated?Date.parse(DATA.updated+'T00:00:00+03:00'):0);
const ago=ms=>{if(!ms)return'—';const m=Math.floor((Date.now()-ms)/6e4);return m<1?'الآن':m<60?`قبل ${m} د`:m<1440?`قبل ${Math.floor(m/60)} س`:`قبل ${Math.floor(m/1440)} يوم`};
/* لون مؤشر الحداثة: أخضر حتى ٩٠ د · أصفر حتى ٤ س · أحمر عند الانقطاع أو القِدم */
function freshness(){
  if(forceFresh)return forceFresh;
  const off=forceOff||ST.net===false||navigator.onLine===false||ST.data.ok===false;
  if(off)return'r';
  const age=Date.now()-genMs();
  return !genMs()?'r':age<=90*6e4?'g':age<=4*36e5?'y':'r';
}
const NAMES={g:'أخضر',y:'أصفر',r:'أحمر'};
function srcRows(){
  const g=genMs(),dataBad=ST.data.ok===false,old=ms=>ms&&Date.now()-ms>4*36e5;
  const lvl=(ms,bad)=>bad?'r':!ms?'r':old(ms)?'r':Date.now()-ms>90*6e4?'y':'g';
  const rows=[];
  const net=forceOff||navigator.onLine===false||(ST.data.ok===false&&ST.wx.ok===false);
  rows.push({n:'الإنترنت',l:net?'r':'g',t:net?'غير متصل':'متصل',why:net?'لا يوجد اتصال بالإنترنت':''});
  rows.push({n:'ملف البيانات',l:lvl(g,dataBad),t:ago(g),why:dataBad?ST.data.err+' — تُعرض آخر نسخة محفوظة':(!g?'لا توجد نسخة بعد':old(g)?'لم يُحدَّث منذ مدة — تحقق من تشغيل التحديث على GitHub':'')});
  const w=DATA.wx,wms=w?Date.parse(w.at+':00+03:00'):0;
  rows.push({n:'الطقس',l:lvl(wms||ST.wx.at,ST.wx.ok===false),t:ago(wms||ST.wx.at),why:ST.wx.ok===false?ST.wx.err:(!w?'لا توجد بيانات طقس':'')});
  const arr=(k,label,emptyOk)=>{const a=DATA[k],has=Array.isArray(a)&&a.length;rows.push({n:label,l:has?(dataBad?'y':lvl(g,false)):emptyOk?'g':'y',t:has?ago(g):(emptyOk?'لا جديد':'—'),why:has?(dataBad?'من النسخة المحفوظة':''):emptyOk?'':'لا توجد بيانات في الملف'})};
  arr('news','الأخبار');arr('fx','دوري روشن',true);
  const a=DATA.ahli;rows.push({n:'بطاقة الأهلي',l:a&&a.rank?(dataBad?'y':lvl(g,false)):'y',t:a&&a.rank?ago(g):'—',why:a&&a.rank?(dataBad?'من النسخة المحفوظة':''):'بانتظار بيانات الأهلي'});
  arr('eu','الدوريات الأوروبية',true);
  if(DATA.status)rows.forEach(r=>{const s=DATA.status[r.n];if(s&&s.ok===false){r.l='r';r.why=s.err||'تعذّر التحديث'}});
  return rows;
}
function renderStatus(){
  const f=freshness(),B=document.body.classList;B.remove('st-g','st-y','st-r');B.add('st-'+f);
  $('rf').setAttribute('aria-label','تحديث البيانات — '+({g:'البيانات حديثة',y:'البيانات متأخرة قليلاً',r:'البيانات قديمة أو لا يوجد اتصال'})[f]);
  const el=$('stl');if(!el)return;
  el.innerHTML=srcRows().map(r=>`<div class="st ${r.l}${r.why?' w':''}"><i></i><span class="nm">${r.n}</span><span class="tm">${r.t}</span>${r.why?`<span class="why">${r.why}</span>`:''}</div>`).join('');
}
$('rf').addEventListener('click',()=>loadData(true));
function runTest(t){
  if(t==='fresh'){const o=[null,'g','y','r'],i=o.indexOf(forceFresh);forceFresh=o[(i+1)%4];renderStatus();toast(forceFresh?'تجربة: '+NAMES[forceFresh]:'عاد المؤشر للوضع الحقيقي')}
  else if(t==='off'){forceOff=!forceOff;loadData();toast(forceOff?'تجربة انقطاع الإنترنت — اضغط مرة ثانية للإيقاف':'عاد الاتصال')}
  else toast('هذه التجربة تعمل بعد بناء المرحلة المرتبطة بها');
}
/* ---------- رسالة قصيرة ---------- */
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
/* ---------- تشغيل ---------- */
buildSettings();applyS();safe(renderClock);safe(renderStatus);
loadData();
setInterval(()=>safe(renderClock),1000);
setInterval(()=>safe(renderStatus),30000);
let rT;function sched(){clearInterval(rT);if(+S.refresh)rT=setInterval(loadData,+S.refresh*6e4)}
sched();document.addEventListener('click',e=>{if(e.target.closest('[data-s="refresh"]'))sched()});
window.addEventListener('online',()=>{ST.net=true;loadData()});window.addEventListener('offline',()=>{ST.net=false;safe(renderStatus)});
setInterval(()=>{const r=()=>Math.round((Math.random()-.5)*20);$('app').style.transform=`translate(${r()}px,${r()}px)`},60000);
</script>
</body>
</html>
