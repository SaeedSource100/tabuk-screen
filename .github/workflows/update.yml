name: update-data
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - run: |
          git config user.name "tabuk-bot"
          git config user.email "tabuk-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
